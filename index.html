<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <title>Paleta de Colores Aleatoria</title>
</head>

<body>
  
  <header class="header">
    <div class="header-contenido">
      <h1 class="titulo-principal">paleTTe</h1>
      <p class="descripcion">Generador de colores aleatorio</p>
    </div>
  </header>
  
  <main class="contenedor">
    <section class="contenido-principal">
      <div class="section-generar">
        <div class="boton-para-generar">
          <button class="btn-generar" type="button">Generar</button>
        </div>
      </div>
      <div class="area-botones" aria-live="polite">
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
      </div>
      <aside class="aside">
        <div class="formato">
          <h3 class="titulo-terciario">Elige el formato de tu color</h3>
          <div class="botones-formato">
            <button id="btn-hsl" class="btn-formato" type="button">HSL</button>
            <button id="btn-hex" class="btn-formato" type="button">HEX</button>
          </div>
        </div>
        <div class="paletas-guardadas">
          <div class="controles-paletas">
            <button class="btn-guardar-paleta">Guardar paleta actual</button>
            <button class="btn-paletas">Paletas guardadas</button>
          </div>
          <div class="desplegable-paletas"></div>
        </div>
        <div class="cantidad-colores">
           <h3 class="titulo-terciario">¡Puedes descubrir 6, 8 o 9 colores cada vez!</h3>
           <div class="botones-cantidad">
            <button id="btn-6" class="btn-cantidad" type="button">6</button>
            <button id="btn-8" class="btn-cantidad" type="button">8</button>
            <button id="btn-9" class="btn-cantidad" type="button">9</button>
          </div>
        </div>
      </aside>
    </section>
  </main>
  <footer class="footer">
    <div class="redes-sociales">
      <a href="https://github.com/davirigoyen" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/davidairigoyen/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </div>
    <div class="css-validado">
      <p>
        <a href="https://jigsaw.w3.org/css-validator/validator?lang=es&profile=css3svg&uri=https%3A%2F%2Fdavirigoyen.github.io%2FProyectoM1_DavidIrigoyen%2F&usermedium=all&vextwarning=&warning=1" target="_blank">
          <img src="https://jigsaw.w3.org/css-validator/images/vcss-blue"
            alt="¡CSS Válido!" />
        </a>
      </p>
    </div> 
    <p class="info">Palette &copy; 2026 | David Irigoyen</p>
  </footer>
  <div class="sombra-izquierda"></div>
  <div class="sombra-derecha"></div>
  <div class="toast" id="toast"></div>
  <script src="./js/script.js"></script>
</body>
</html>
