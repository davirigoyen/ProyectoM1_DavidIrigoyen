<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/styles.css">
  <title>Paleta de Colores Aleatoria</title>
</head>

<body>
  
  <header>
    <h1>paleTTe</h1>
    <p>Generador de colores aleatorio</p>
  </header>
  
  <main>
    <section>
      <h2>Generar paleta</h2>
        <p>Clickea el boton "Generar"
        y se establecerá una paleta de colores aleatoria</p>
      <button id="btn-generar" type="button">Generar</button>
      <h3>Guardar colores</h3>
        <p>Puedes guardar tus colores eligiendo el que quieras</p>
      <div id="area-botones" aria-live="polite">
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
        <button class="btn-generado" type="button"></button>
       </div>
      <aside>
        <p>¡Puedes descubrir 6, 8 o 9 colores cada vez!</p>
        <p>Fija tu preferencia aquí 👇</p>
        <button id="btn-6" class="btn-cantidad" type="button">6</button>
        <button id="btn-8" class="btn-cantidad" type="button">8</button>
        <button id="btn-9" class="btn-cantidad" type="button">9</button>
      </aside>
    </section>
  </main>
  
  <script src="/js/script.js"></script>
</body>
</html>
