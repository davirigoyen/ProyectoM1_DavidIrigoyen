<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/styles.css">
  <title>Paleta de Colores Aleatoria</title>
</head>

<body>
  
  <header>
    <h1>paleTTe</h1>
    <p>Generador de colores aleatorio</p>
  </header>
  
  <main>
    <h2>Clickea el boton "Generar"
       y se establecerá una paleta de colores aleatoria</h2>
    <section>
      <button>Generar</button>
      <aside>
        <h3>¡Puedes descubrir 6, 8 o 9 colores cada vez!</h3>
        <p>Fija tu preferencia aquí 👇</p>
        <button>6</button>
        <button>8</button>
        <button>9</button>
      </aside>
    </section>
  </main>
  
  <script src="/js/script.js"></script>
</body>
</html>
